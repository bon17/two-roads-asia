<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>청나라 머지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2a20; --paper:#fffaf0; --bg1:#ffe9a8; --bg2:#ffcf6e;
  --danger:#ff4d4d; --gold:#ffc93c; --card:#ffffff;
  --badge:52px; /* 오른쪽 아래 'Powered by Netlify' 표시 자리 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));user-select:none;-webkit-user-select:none}
#app{touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- 게임 화면 배치 (넓은 가로 화면: 태블릿 가로·컴퓨터) ---------- */
#app{position:fixed;inset:0;margin:auto;display:grid;gap:14px;padding:14px 14px var(--badge);
  grid-template-columns:minmax(140px,220px) minmax(0,1fr) minmax(140px,220px);grid-template-rows:minmax(0,1fr);
  max-width:calc((100vh - 28px)*.65 + 500px);max-width:calc((100dvh - 28px)*.65 + 500px)}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0;overflow:auto}
.panel{background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 rgba(59,42,32,.25)}
.label{font-size:17px;opacity:.75}
#score{font-size:44px;line-height:1.05}
#best{font-size:22px}
#nextBox{display:flex;flex-direction:column;align-items:center;gap:6px}
#nextImg{width:88px;height:88px;border-radius:50%}
#nextName{font-size:18px;text-align:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#btnRestart{grid-column:1/-1}
.iconbtn{min-height:64px;min-width:48px;font-size:20px;background:var(--card);border:4px solid var(--ink);border-radius:18px;
  box-shadow:0 4px 0 rgba(59,42,32,.25);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,32,.25)}
.iconbtn .ic{font-size:1.15em}

#stageWrap{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;aspect-ratio:520/800;container-type:inline-size}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:4%;right:4%;top:2%;display:flex;gap:2.2cqw;align-items:center;
  background:var(--card);border:4px solid var(--ink);border-radius:20px;padding:1.6cqw 2.4cqw;
  box-shadow:0 5px 0 rgba(59,42,32,.25);opacity:0;transform:translateY(-12px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast img{width:clamp(36px,10.5cqw,56px);height:clamp(36px,10.5cqw,56px);border-radius:50%;flex:none}
#toastTitle{font-size:clamp(15px,4.1cqw,22px)}
#toastText{font-size:clamp(12px,3.2cqw,17px);line-height:1.3}

/* 연표 띠 */
#timeline{display:flex;flex-direction:column;gap:2px;padding:10px 8px}
.tl{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:12px;min-width:0}
.tl img{width:40px;height:40px;border-radius:50%;filter:grayscale(1) opacity(.45);flex:none}
.tl.on img{filter:none}
.tl.now{background:#fff2c4}
.tl span{font-size:15px;line-height:1.1;min-width:0}
.tl small{display:block;font-size:12px;opacity:.7}
.tl:not(.on) span{opacity:.45}

/* ---------- 세로 화면 (휴대폰·태블릿 세로) ---------- */
@media (orientation:portrait){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:8px 8px var(--badge);max-width:820px}
  .side{overflow:visible}
  .side.left{flex-direction:row;gap:8px;align-items:stretch}
  #scoreBox{flex:1;min-width:0;padding:6px 12px;display:flex;flex-direction:column;justify-content:center}
  #score{font-size:30px}
  .label{font-size:14px}
  #best{font-size:16px}
  #nextBox{flex-direction:row;padding:6px 10px;gap:8px}
  #nextImg{width:52px;height:52px}
  #nextName{font-size:16px}
  .btns{display:flex;gap:8px}
  .iconbtn{min-height:56px;font-size:18px}
  #timeline{flex-direction:row;padding:6px;gap:2px}
  .tl{flex:1 1 0;flex-direction:column;gap:2px;padding:3px 1px;text-align:center}
  .tl img{width:100%;max-width:48px;height:auto;aspect-ratio:1}
  .tl span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tl small{display:none}
}
/* 태블릿 세로: 위쪽 칸을 조금 크게 */
@media (orientation:portrait) and (min-width:621px){
  #score{font-size:38px} .label{font-size:16px} #best{font-size:18px}
  #nextImg{width:64px;height:64px} #nextName{font-size:18px}
  .iconbtn{min-height:68px;font-size:20px;padding:0 14px}
  .tl img{max-width:52px} .tl span{font-size:12px}
}
/* 휴대폰 세로: 글자 버튼을 아이콘만 */
@media (orientation:portrait) and (max-width:620px){
  .iconbtn{min-height:48px;min-width:48px;width:48px;padding:0;font-size:22px;border-width:3px;border-radius:14px}
  .iconbtn .tx{display:none}
  #nextBox .label,#nextName{display:none}
  #nextBox{padding:4px 8px}
  #nextImg{width:48px;height:48px}
  #score{font-size:26px}
  .panel{border-width:3px;border-radius:16px}
  .tl span{display:none}
  .tl{padding:2px 0}
}
/* 휴대폰 가로 (높이가 낮은 화면) */
@media (orientation:landscape) and (max-height:540px){
  #app{gap:8px;padding:8px;grid-template-columns:minmax(118px,170px) minmax(0,1fr) minmax(92px,140px);
    max-width:calc((100vh - 16px)*.65 + 340px);max-width:calc((100dvh - 16px)*.65 + 340px)}
  .side{gap:8px}
  .panel{border-width:3px;border-radius:16px;padding:6px 10px}
  .label{font-size:13px}
  #score{font-size:26px}
  #best{font-size:15px}
  #nextImg{width:52px;height:52px}
  #nextName{font-size:14px}
  .btns{display:flex;gap:6px}
  .iconbtn{flex:1;min-height:46px;padding:0;font-size:20px;border-width:3px;border-radius:14px}
  .iconbtn .tx{display:none}
  #timeline{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px}
  .tl{padding:2px;justify-content:center}
  .tl img{width:100%;max-width:44px;height:auto;aspect-ratio:1}
  .tl span{display:none}
}

/* ---------- 덮개 화면 ---------- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px 16px var(--badge);
  background:rgba(59,42,32,.45);z-index:10}
.overlay.show{display:flex}
.sheet{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet{background:var(--paper);border:5px solid var(--ink);border-radius:28px;padding:22px 24px;
  max-width:640px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(59,42,32,.3)}
.sheet h1{font-size:44px;margin:4px 0 2px;line-height:1.1}
.sheet h2{font-size:34px;margin:4px 0 8px}
.sub{font-size:19px;opacity:.8;margin-bottom:12px}
.big{display:block;width:100%;min-height:88px;font-size:32px;margin-top:14px;background:var(--gold);
  border:5px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 rgba(59,42,32,.35)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(59,42,32,.35)}
.mid{display:block;width:100%;min-height:72px;font-size:24px;margin-top:12px;background:var(--card);
  border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 rgba(59,42,32,.25)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.how div{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 8px;font-size:17px;line-height:1.35}
.how b{display:block;font-size:30px;font-weight:normal}
.ladder{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:10px 0}
.ladder img{width:44px;height:44px;border-radius:50%}
#coverArt{width:150px;height:150px;border-radius:50%;margin-top:4px}

.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px;text-align:left}
.dexc{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dexc img{width:96px;height:96px;border-radius:50%}
.dexc.lock img{filter:brightness(0) opacity(.2)}
.dexc .n{font-size:20px;text-align:center}
.dexc .y{font-size:15px;opacity:.7}
.dexc .t{font-size:15px;line-height:1.35;text-align:center}
.star{color:#e6a400}
#keyCount{font-size:20px}
.result{font-size:22px;line-height:1.6}
.result b{font-size:40px;font-weight:normal}
#newBest{color:#e63946;font-size:24px;display:none}
@media (max-width:560px){
  .overlay{padding:8px}
  .sheet{padding:16px 14px;border-radius:22px;border-width:4px}
  .sheet h1{font-size:36px} .sheet h2{font-size:30px} .sub{font-size:17px}
  #coverArt{width:110px;height:110px}
  .how{grid-template-columns:1fr;gap:8px}
  .how div{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px;font-size:17px}
  .how br{display:none}
  .how b{font-size:28px}
  .ladder img{width:34px;height:34px}
  .big{min-height:72px;font-size:28px}
  .mid{min-height:60px;font-size:22px}
  .dex{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .dexc{padding:8px}
  .dexc img{width:72px;height:72px}
  .dexc .n{font-size:17px} .dexc .t{font-size:14px}
  .result b{font-size:34px}
}
@media (orientation:landscape) and (max-height:540px){
  .overlay{padding:8px}
  .sheet{padding:12px 18px}
  #coverArt,.sub{display:none}
  .sheet h1{font-size:32px} .sheet h2{font-size:28px}
  .how div{padding:6px;font-size:15px} .how b{font-size:22px}
  .ladder{margin:6px 0} .ladder img{width:32px;height:32px}
  .big{min-height:60px;font-size:26px;margin-top:8px}
  .mid{min-height:52px;font-size:20px;margin-top:8px}
  .result{font-size:18px;line-height:1.4} .result b{font-size:30px}
}

</style>
</head>
<body>
<div id="app">
  <aside class="side left">
    <div class="panel" id="scoreBox"><div class="label">점수</div><div id="score">0</div><div class="label">최고 <span id="best">0</span></div></div>
    <div class="panel" id="nextBox"><div class="label">다음</div><img id="nextImg" alt=""><div id="nextName"></div></div>
    <div class="btns">
      <button class="iconbtn" id="btnDex" aria-label="도감"><span class="ic">📖</span><span class="tx">도감</span></button>
      <button class="iconbtn" id="btnSound" aria-label="소리"><span class="ic">🔊</span><span class="tx">소리</span></button>
      <button class="iconbtn" id="btnRestart" aria-label="처음부터"><span class="ic">↺</span><span class="tx">처음부터</span></button>
    </div>
  </aside>
  <main id="stageWrap">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toast"><img id="toastImg" alt=""><div><div id="toastTitle"></div><div id="toastText"></div></div></div>
    </div>
  </main>
  <aside class="side right">
    <div class="panel" id="timeline"></div>
  </aside>
</div>

<!-- 시작 화면 -->
<div class="overlay show" id="ovStart">
  <div class="sheet">
    <img id="coverArt" src="img/11.webp" alt="중화민국 카드">
    <h1>청나라 머지</h1>
    <div class="sub">차 한 잔에서 공화국까지, 역사를 합쳐라!</div>
    <div class="how">
      <div id="howMove"><b>👆</b><span>손가락으로 옮기고 <br>떼면 떨어져요</span></div>
      <div><b>🤝</b><span>같은 카드끼리 닿으면 <br>다음 사건이 돼요</span></div>
      <div><b>🚫</b><span>빨간 선 위로 <br>넘치면 끝!</span></div>
    </div>
    <div class="ladder" id="ladder"></div>
    <button class="big" id="btnStart">시작하기</button>
    <button class="mid" id="btnDex2">📖 도감 보기</button>
  </div>
</div>

<!-- 끝 화면 -->
<div class="overlay" id="ovOver">
  <div class="sheet">
    <h2>통이 넘쳤어요!</h2>
    <div class="result">이번 점수<br><b id="finalScore">0</b></div>
    <div id="newBest">🎉 최고 기록!</div>
    <div class="result" id="finalReach"></div>
    <button class="big" id="btnAgain">다시 하기</button>
    <button class="mid" id="btnDex3">📖 도감 보기</button>
  </div>
</div>

<!-- 도감 -->
<div class="overlay" id="ovDex">
  <div class="sheet" style="max-width:900px">
    <h2>역사 도감</h2>
    <div id="keyCount"></div>
    <div class="dex" id="dex"></div>
    <button class="big" id="btnDexClose">닫기</button>
  </div>
</div>

<script src="matter.min.js"></script>
<script>
"use strict";
/* ================= 카드 데이터 (중국판 11단계) ================= */
const CARDS = [
  {name:"차",            year:"",     key:false, line:"영국 사람들이 즐겨 마신 청의 차"},
  {name:"은",            year:"",     key:false, line:"영국은 청의 차를 사고 값을 은으로 냈다"},
  {name:"아편",          year:"",     key:false, line:"은이 모자란 영국이 인도산 아편을 몰래 팔았다(삼각 무역)"},
  {name:"아편 전쟁",     year:"1840", key:true,  line:"임칙서가 아편을 단속하자 영국이 군함으로 공격했다"},
  {name:"난징 조약",     year:"1842", key:false, line:"진 청이 항구 5개를 열고 홍콩을 넘겼다(불평등 조약)"},
  {name:"태평천국 운동", year:"1851", key:true,  line:"배상금 때문에 세금이 늘자 홍수전이 들고일어났다"},
  {name:"양무운동",      year:"1861", key:true,  line:"서양 무기에 놀란 관료들이 기술만 들여왔다(중체서용)"},
  {name:"변법자강 운동", year:"1898", key:true,  line:"청일 전쟁에 지자 캉유웨이가 제도까지 바꾸려 했다"},
  {name:"의화단 운동",   year:"1899", key:true,  line:"개혁이 100일 만에 멈추고 열강의 침탈이 심해지자 '부청멸양'을 외쳤다"},
  {name:"신해혁명",      year:"1911", key:true,  line:"철도 국유화에 반발해 우창에서 신식 군대가 봉기했다"},
  {name:"중화민국",      year:"1912", key:false, line:"쑨원이 중국 최초의 공화국을 세웠다"},
];
const N = CARDS.length;
// 지름(월드 좌표, 통 너비 520 기준). 가장 작은 공도 이름표가 읽히게 64 이상.
const DIAM = [64,78,94,110,128,148,170,194,220,250,290];
const POINTS = [1,3,6,10,15,21,28,36,45,55,66];   // 수박게임처럼 삼각수
const SPAWN = [0.36,0.30,0.24,0.10];               // 1~4단계만, 4단계는 드물게
const FINAL_BONUS = 500;

/* ================= 저장 (실패해도 게임은 돌아감) ================= */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("qing-merge:"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("qing-merge:"+k,JSON.stringify(v)); }catch(e){} }
};
let best = store.get("best",0);
let found = new Set(store.get("found",[0]));
let soundOn = store.get("sound",true);

/* ================= 그림 미리 불러오기 ================= */
const IMG = CARDS.map((c,i)=>{ const im=new Image(); im.src=`img/${String(i+1).padStart(2,"0")}.webp`; return im; });
const src = i => IMG[i].src;

/* ================= 소리 (WebAudio로 직접 만듦) ================= */
let ac=null;
function tone(freq,dur,type="sine",vol=.18,slide=0){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(freq*slide,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sDrop=()=>tone(320,.12,"triangle",.12,.6);
const sMerge=t=>{ tone(440*Math.pow(1.12,t),.16,"square",.08,1.5); setTimeout(()=>tone(660*Math.pow(1.12,t),.2,"sine",.12),70); };
const sBig=()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,"triangle",.15),i*110)); };
const sOver=()=>{ [392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.3,"sawtooth",.07),i*160)); };

/* ================= 물리 세계 ================= */
const {Engine,Bodies,Composite,Events,Body} = Matter;
const W=520, H=800;              // 월드 크기(통 + 위쪽 여유)
const WALL=14, TOP=150, LINE_Y=190;   // 떨어뜨리는 높이, 넘침 선
const engine = Engine.create({gravity:{x:0,y:1.15}});
const world = engine.world;
Composite.add(world,[
  Bodies.rectangle(W/2,H+WALL/2-2,W+200,WALL*2,{isStatic:true,friction:.6,label:"wall"}),
  Bodies.rectangle(-WALL/2+4,H/2,WALL*2,H*3,{isStatic:true,friction:.2,label:"wall"}),
  Bodies.rectangle(W+WALL/2-4,H/2,WALL*2,H*3,{isStatic:true,friction:.2,label:"wall"}),
]);

let score=0, holdTier=0, nextTier=0, dropX=W/2, canDrop=true, over=false, running=false, maxTier=0;
let dangerT=0, pops=[], flashes=[];

function pickTier(){ let r=Math.random(), a=0; for(let i=0;i<SPAWN.length;i++){ a+=SPAWN[i]; if(r<a) return i; } return 0; }
function radius(t){ return DIAM[t]/2; }

function makeBall(t,x,y){
  const b = Bodies.circle(x,y,radius(t),{restitution:.12,friction:.35,frictionStatic:.6,density:.0012,label:"ball"});
  b.tier=t; b.born=performance.now(); b.merged=false;
  Composite.add(world,b); return b;
}

function clampX(x,t){ const r=radius(t)+2; return Math.max(r+2,Math.min(W-r-2,x)); }

function drop(){
  if(!running||over||!canDrop) return;
  canDrop=false;
  makeBall(holdTier,clampX(dropX,holdTier),TOP);
  sDrop();
  holdTier=nextTier; nextTier=pickTier(); renderNext();
  setTimeout(()=>{canDrop=true;},550);
}

/* 같은 단계끼리 닿으면 합치기 */
function tryMerge(a,b){
  if(a.label!=="ball"||b.label!=="ball"||a.tier!==b.tier||a.merged||b.merged) return;
  a.merged=b.merged=true;
  const t=a.tier, x=(a.position.x+b.position.x)/2, y=(a.position.y+b.position.y)/2;
  Composite.remove(world,a); Composite.remove(world,b);
  pops.push({x,y,r:radius(t)*1.4,life:1});
  if(t===N-1){                       // 중화민국 두 개 → 둘 다 사라지고 보너스
    addScore(POINTS[t]+FINAL_BONUS); sBig();
    flashes.push({life:1});
    showToast(N-1,"🎉 공화국 완성! +"+(POINTS[t]+FINAL_BONUS),"황제의 나라가 끝나고 중국 최초의 공화국이 세워졌어요.");
    return;
  }
  const nt=t+1;
  const nb=makeBall(nt,x,y);
  Body.setVelocity(nb,{x:0,y:-1.5});
  addScore(POINTS[nt]); sMerge(nt);
  const isNew=!found.has(nt);
  found.add(nt); store.set("found",[...found]);
  maxTier=Math.max(maxTier,nt);
  const c=CARDS[nt];
  showToast(nt,(isNew?"✨ 새 카드! ":"")+c.name+(c.year?" "+c.year:"")+(c.key?" ★":""),c.line);
  renderTimeline();
}
function onPairs(e){ for(const p of e.pairs) tryMerge(p.bodyA,p.bodyB); }
Events.on(engine,"collisionStart",onPairs);
Events.on(engine,"collisionActive",onPairs);

function addScore(n){
  score+=n; document.getElementById("score").textContent=score.toLocaleString();
}

/* ================= 화면 그리기 ================= */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let scale=1, dpr=1;
function resize(){
  const r=cv.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); scale=cv.width/W;
}
new ResizeObserver(resize).observe(cv);
// 통을 칸 안에 꽉 맞추기(가로세로 비율 유지)
const wrapEl=document.getElementById("stageWrap"), stageEl=document.getElementById("stage");
function fitStage(){
  const r=wrapEl.getBoundingClientRect(); let h=r.height, w=h*W/H;
  if(w>r.width){ w=r.width; h=w*H/W; }
  stageEl.style.width=Math.floor(w)+"px"; stageEl.style.height=Math.floor(h)+"px";
}
new ResizeObserver(fitStage).observe(wrapEl);

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawCard(t,x,y,angle,alpha=1){
  const r=radius(t), im=IMG[t];
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y);
  ctx.save(); ctx.rotate(angle);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.closePath();
  ctx.fillStyle="#fff"; ctx.fill();
  if(im.complete&&im.naturalWidth){ ctx.save(); ctx.clip(); ctx.drawImage(im,-r*1.02,-r*1.02,r*2.04,r*2.04); ctx.restore(); }
  ctx.restore();
  // 이름표: 공이 굴러도 글자는 똑바로
  const c=CARDS[t], fs=Math.max(13,Math.min(26,r*.27));
  ctx.font=`${fs}px Jua, sans-serif`;
  const yr=(c.year&&t>=3)?" "+c.year:"";
  const nameW=ctx.measureText(c.name).width;
  ctx.font=`${fs*.72}px Jua, sans-serif`; const yrW=yr?ctx.measureText(yr).width:0;
  const w=nameW+yrW+fs*1.0, h=fs*1.45, ly=r*.62;
  rr(-w/2,ly-h/2,w,h,h/2); ctx.fillStyle="#fff"; ctx.fill();
  ctx.lineWidth=Math.max(2,fs*.16); ctx.strokeStyle="#3b2a20"; ctx.stroke();
  ctx.fillStyle="#3b2a20"; ctx.textBaseline="middle";
  ctx.font=`${fs}px Jua, sans-serif`; ctx.textAlign="left";
  ctx.fillText(c.name,-w/2+fs*.5,ly+fs*.06);
  if(yr){ ctx.font=`${fs*.72}px Jua, sans-serif`; ctx.fillText(yr,-w/2+fs*.5+nameW,ly+fs*.1); }
  ctx.restore();
}

function frame(){
  const paused=document.getElementById("ovDex").classList.contains("show");
  if(running&&!over&&!paused){ Engine.update(engine,1000/60); checkDanger(); } else lastT=performance.now();
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,0,0);
  // 통
  rr(4,LINE_Y-40,W-8,H-LINE_Y+36,28); ctx.fillStyle="rgba(255,255,255,.42)"; ctx.fill();
  ctx.lineWidth=7; ctx.strokeStyle="#3b2a20";
  ctx.beginPath(); ctx.moveTo(4,LINE_Y-40); ctx.lineTo(4,H-30); ctx.arcTo(4,H-3,30,H-3,28); ctx.lineTo(W-30,H-3); ctx.arcTo(W-4,H-3,W-4,H-30,28); ctx.lineTo(W-4,LINE_Y-40); ctx.stroke();
  // 넘침 선
  const blink = dangerT>0 && Math.floor(performance.now()/180)%2===0;
  ctx.setLineDash([14,10]); ctx.lineWidth=blink?6:4; ctx.strokeStyle=blink?"#ff1f1f":"rgba(255,77,77,.85)";
  ctx.beginPath(); ctx.moveTo(8,LINE_Y); ctx.lineTo(W-8,LINE_Y); ctx.stroke(); ctx.setLineDash([]);
  // 떨어뜨릴 위치 안내선 + 들고 있는 카드
  if(running&&!over){
    const x=clampX(dropX,holdTier);
    ctx.strokeStyle="rgba(59,42,32,.25)"; ctx.lineWidth=3; ctx.setLineDash([6,8]);
    ctx.beginPath(); ctx.moveTo(x,TOP+radius(holdTier)); ctx.lineTo(x,H-10); ctx.stroke(); ctx.setLineDash([]);
    drawCard(holdTier,x,TOP-radius(holdTier)*0+0,0,canDrop?1:.35);
  }
  // 공들
  for(const b of Composite.allBodies(world)) if(b.label==="ball") drawCard(b.tier,b.position.x,b.position.y,b.angle);
  // 합쳐질 때 퍼지는 고리
  for(const p of pops){ p.life-=.05; ctx.globalAlpha=Math.max(0,p.life); ctx.lineWidth=6; ctx.strokeStyle="#fff";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.6-p.life*.6),0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
  pops=pops.filter(p=>p.life>0);
  for(const f of flashes){ f.life-=.02; ctx.fillStyle=`rgba(255,215,80,${Math.max(0,f.life)*.5})`; ctx.fillRect(0,0,W,H); }
  flashes=flashes.filter(f=>f.life>0);
  requestAnimationFrame(frame);
}

/* 넘침 판정: 막 떨어뜨린 공은 빼고, 선 위에 2.5초 머물면 끝 */
let lastT=performance.now();
function checkDanger(){
  const now=performance.now(), dt=now-lastT; lastT=now;
  let danger=false;
  for(const b of Composite.allBodies(world)){
    if(b.label!=="ball"||now-b.born<1500) continue;
    if(b.position.y-radius(b.tier)<LINE_Y && Math.abs(b.velocity.y)<1.2) { danger=true; break; }
  }
  dangerT = danger ? dangerT+dt : 0;
  if(dangerT>2500) gameOver();
}

/* ================= 입력 (터치·마우스) ================= */
function toWorldX(clientX){ const r=cv.getBoundingClientRect(); return (clientX-r.left)/r.width*W; }
let pressing=false;
cv.addEventListener("pointerdown",e=>{ if(!running||over) return; pressing=true; dropX=toWorldX(e.clientX); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!running||over) return; dropX=toWorldX(e.clientX); });
cv.addEventListener("pointerup",e=>{ if(!pressing) return; pressing=false; dropX=toWorldX(e.clientX); drop(); });
cv.addEventListener("pointercancel",()=>{pressing=false;});
// 컴퓨터: ← → 로 옮기고 스페이스·엔터·↓ 로 떨어뜨리기
const anyOverlay=()=>document.querySelector(".overlay.show");
window.addEventListener("keydown",e=>{
  if(!running||over||anyOverlay()) return;
  if(e.key==="ArrowLeft"){ dropX=clampX(dropX,holdTier)-18; e.preventDefault(); }
  else if(e.key==="ArrowRight"){ dropX=clampX(dropX,holdTier)+18; e.preventDefault(); }
  else if(e.key===" "||e.key==="Enter"||e.key==="ArrowDown"){ if(!e.repeat) drop(); e.preventDefault(); }
});
if(window.matchMedia&&matchMedia("(hover:hover) and (pointer:fine)").matches){
  document.querySelector("#howMove span").textContent="마우스로 옮기고 클릭! (← → 키와 스페이스도 돼요)";
  document.querySelector("#howMove b").textContent="🖱️";
}

/* ================= 화면 조각들 ================= */
function renderNext(){
  const im=document.getElementById("nextImg"); im.src=src(nextTier); im.alt=CARDS[nextTier].name;
  document.getElementById("nextName").textContent=CARDS[nextTier].name;
}
function renderTimeline(){
  const el=document.getElementById("timeline"); el.textContent="";
  CARDS.forEach((c,i)=>{
    const d=document.createElement("div"); d.className="tl"+(found.has(i)?" on":"")+(i===maxTier?" now":"");
    const im=document.createElement("img"); im.src=src(i); im.alt="";
    const s=document.createElement("span"); s.textContent=(c.key?"★ ":"")+c.name;
    if(c.year){ const sm=document.createElement("small"); sm.textContent=c.year; s.appendChild(sm); }
    d.append(im,s); el.appendChild(d);
  });
}
let toastTimer=null;
function showToast(t,title,text){
  document.getElementById("toastImg").src=src(t);
  document.getElementById("toastTitle").textContent=title;
  document.getElementById("toastText").textContent=text;
  const el=document.getElementById("toast"); el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}
function renderLadder(){
  const el=document.getElementById("ladder"); el.textContent="";
  CARDS.forEach((c,i)=>{ const im=document.createElement("img"); im.src=src(i); im.alt=c.name; el.appendChild(im);
    if(i<N-1){ const a=document.createElement("span"); a.textContent="›"; a.style.cssText="font-size:26px;align-self:center"; el.appendChild(a);} });
}
function renderDex(){
  const el=document.getElementById("dex"); el.textContent="";
  const keys=CARDS.filter(c=>c.key).length, got=CARDS.filter((c,i)=>c.key&&found.has(i)).length;
  document.getElementById("keyCount").textContent=`수업 키워드 ★ ${got} / ${keys} · 카드 ${found.size} / ${N}`;
  CARDS.forEach((c,i)=>{
    const on=found.has(i), d=document.createElement("div"); d.className="dexc"+(on?"":" lock");
    const im=document.createElement("img"); im.src=src(i); im.alt=on?c.name:"아직 모르는 카드";
    const n=document.createElement("div"); n.className="n"; n.textContent=on?(c.key?"★ ":"")+c.name:`${i+1}단계 · ???`;
    const y=document.createElement("div"); y.className="y"; y.textContent=on?(c.year||" "):" ";
    const t=document.createElement("div"); t.className="t"; t.textContent=on?c.line:`${CARDS[Math.max(0,i-1)].name} 두 개를 합쳐 보세요`;
    d.append(im,n,y,t); el.appendChild(d);
  });
}
function show(id,on){ document.getElementById(id).classList.toggle("show",on); }

/* ================= 게임 흐름 ================= */
function clearBalls(){ for(const b of Composite.allBodies(world)) if(b.label==="ball") Composite.remove(world,b); }
function start(){
  clearBalls(); score=0; addScore(0); over=false; running=true; dangerT=0; lastT=performance.now(); maxTier=0;
  holdTier=pickTier(); nextTier=pickTier(); canDrop=true; dropX=W/2;
  renderNext(); renderTimeline(); show("ovStart",false); show("ovOver",false);
  document.getElementById("best").textContent=best.toLocaleString();
}
function gameOver(){
  over=true; running=false; sOver();
  const isBest=score>best; if(isBest){ best=score; store.set("best",best); }
  document.getElementById("best").textContent=best.toLocaleString();
  document.getElementById("finalScore").textContent=score.toLocaleString();
  document.getElementById("newBest").style.display=isBest?"block":"none";
  const c=CARDS[maxTier];
  document.getElementById("finalReach").textContent=`이번 판 최고 카드: ${c.name}${c.year?" ("+c.year+")":""}`;
  show("ovOver",true);
}

document.getElementById("btnStart").onclick=start;
document.getElementById("btnAgain").onclick=start;
document.getElementById("btnRestart").onclick=()=>{ if(confirm("처음부터 다시 할까요?")) start(); };
const openDex=()=>{ renderDex(); show("ovDex",true); };
document.getElementById("btnDex").onclick=openDex;
document.getElementById("btnDex2").onclick=openDex;
document.getElementById("btnDex3").onclick=openDex;
document.getElementById("btnDexClose").onclick=()=>show("ovDex",false);
const btnSound=document.getElementById("btnSound");
function renderSound(){ btnSound.querySelector(".ic").textContent=soundOn?"🔊":"🔇"; btnSound.setAttribute("aria-pressed",String(soundOn)); }
btnSound.onclick=()=>{ soundOn=!soundOn; store.set("sound",soundOn); renderSound(); };

document.getElementById("best").textContent=best.toLocaleString();
renderSound(); renderLadder(); renderTimeline(); holdTier=0; nextTier=pickTier(); renderNext();
resize(); requestAnimationFrame(frame);

// 시험용 손잡이(자동 점검에서만 씀)
window.__game={drop:(x)=>{dropX=x;drop();},state:()=>({score,running,over,balls:Composite.allBodies(world).filter(b=>b.label==="ball").map(b=>b.tier)}),force:(t,x,y)=>makeBall(t,x,y)};
</script>
</body>
